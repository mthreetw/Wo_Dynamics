<!DOCTYPE html><html lang="zh-Hant"><meta charset="utf-8">
<title>論文引用關係</title>
<style>
  body{font-family:system-ui,"Noto Sans TC",sans-serif;margin:2rem;background:#fafafa}
  h1{font-size:1.2rem}
  .node{border:1px solid #ddd;border-radius:6px;padding:.6rem .8rem;margin:.4rem 0;background:#fff}
  .ext{background:#f6f6f6;color:#666}
  .refs{color:#888;font-size:.85rem;margin-left:1rem}
  code{background:#eee;padding:0 .2rem;border-radius:3px}
</style>
<h1>論文引用關係</h1><div id="out"></div>
<script>
const nodes=[
  {id:"paper_37b3643a_dc40_4463_8b36_4f4594acd986",title:"渦動力學",concepts:36,pub:26,external:false},
  {id:"paper_54c0291d_05b3_431a_9f2a_1b8ec93c3c3f",title:"暗宇宙的本體論",concepts:38,pub:17,external:false},
  {id:"paper_b9df3b68_23ee_4839_965b_ed0e6b283ee6",title:"四條律相關工具及範例",concepts:54,pub:33,external:false},
  {id:"paper_fb0addca_42b6_4884_aa18_438c695747ab",title:"三重幻覺與被迫的賭注",concepts:28,pub:26,external:false}
];
const edges=[
  {from:"paper_37b3643a_dc40_4463_8b36_4f4594acd986",to:"paper_54c0291d_05b3_431a_9f2a_1b8ec93c3c3f"},
  {from:"paper_b9df3b68_23ee_4839_965b_ed0e6b283ee6",to:"paper_37b3643a_dc40_4463_8b36_4f4594acd986"},
  {from:"paper_fb0addca_42b6_4884_aa18_438c695747ab",to:"paper_37b3643a_dc40_4463_8b36_4f4594acd986"},
  {from:"paper_fb0addca_42b6_4884_aa18_438c695747ab",to:"paper_b9df3b68_23ee_4839_965b_ed0e6b283ee6"}
];
const out=document.getElementById('out');
for(const n of nodes){
  const d=document.createElement('div');
  d.className='node'+(n.external?' ext':'');
  const rs=edges.filter(e=>e.from===n.id).map(e=>e.to);
  d.innerHTML='<b>'+n.title+'</b> <code>'+n.id+'</code>（概念 '+n.concepts+' 條，public '+n.pub+' 條）'+
    (rs.length?'<div class="refs">引用 '+rs.join('、')+'</div>':'');
  out.appendChild(d);
}
</script></html>
